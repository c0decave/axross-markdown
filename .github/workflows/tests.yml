name: tests

on:
  push:
  pull_request:
  # (the release runs it first: nothing is built for a release before the
  # gate and the tests pass)
  workflow_call:
    inputs:
      blocking_only:
        description: the blocking tests only (the release does not wait for the timing ones)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt && python -m pip install --no-build-isolation --no-deps . && python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-test.txt
      - name: Tests (all but the timing ones - those run in the job timing; a duration over its budget a warning here)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest -q -rfE -m "not timing" tests 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: The end of the tests' output as annotations (the short summary)
        if: failure()
        run: python packaging/ci_log_tail.py "$RUNNER_TEMP/tests.log" tests 150
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-build.txt && python -m build --no-isolation

  # The turn gate. A turn is the GUI thread's own CPU time in one event-loop turn: the
  # runner's other work cannot lengthen it. The timing tests run once more for it alone
  # (AXROSS_TIMING_BUDGETS=gate: their wall-clock assertions are warnings here); a turn
  # over tests/markdown_heartbeat.py's TURN_GATE fails the job - and blocks a release.
  turns:
    runs-on: ubuntu-24.04
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt && python -m pip install --no-build-isolation --no-deps . && python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-test.txt
      - name: The timing tests' turns (a turn over the gate fails)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          AXROSS_TIMING_BUDGETS=gate python -m pytest -q -rfE -m timing tests 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: The end of the tests' output as annotations (the short summary)
        if: failure()
        run: python packaging/ci_log_tail.py "$RUNNER_TEMP/tests.log" tests 150

  # The tests that pass or fail by elapsed time only, and the durations of those that
  # assert their content too (tests/markdown_timing.py: timing, budgets): a shared
  # runner about twice as slow fails them without a bug - run strictly and said as
  # warnings, blocking nothing. Locally the whole suite, strictly, is the bar.
  timing:
    if: ${{ !inputs.blocking_only }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: supply-chain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt && python -m pip install --no-build-isolation --no-deps . && python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-test.txt
      - name: The timing tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest -q -rfE -m "timing or budgets" tests 2>&1 | tee "$RUNNER_TEMP/timing.log"
      - name: Their summary as warnings (the timing tests block nothing)
        if: failure()
        run: python packaging/ci_log_tail.py --warning "$RUNNER_TEMP/timing.log" "timing tests (not blocking)" 150

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: axross's supply-chain gate and its reviewed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: c0decave/axross
          # (pinned by commit - axross v0.15.180: its default branch was an older release, its baseline
          # older than this lock's, and the gate failed)
          ref: 37373f7fd46e2a9105be1d22ffd44046ff27f7bf
          path: .axross
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /security/
            /build/requirements-scan-tools.txt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Gate (PyPI, OSV, age, names, provenance, content against the baseline)
        run: python -I .axross/security/supply_chain_gate.py --config supply-chain-gate.toml check --report supply-chain-report --reduced-locks reduced
      - name: Scanners from their hashed lock
        run: |
          python -m venv "$RUNNER_TEMP/scan-venv"
          "$RUNNER_TEMP/scan-venv/bin/pip" install -q --require-hashes --only-binary=:all: -r reduced/requirements-scan-tools.txt
          python -I .axross/security/supply_chain_gate.py --config supply-chain-gate.toml verify-env --python "$RUNNER_TEMP/scan-venv/bin/python" --lock .axross/build/requirements-scan-tools.txt
      - name: Gate with the scanners (YARA, attestations)
        run: python -I .axross/security/supply_chain_gate.py --config supply-chain-gate.toml check --scan-python "$RUNNER_TEMP/scan-venv/bin/python" --report supply-chain-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: supply-chain-report
          path: supply-chain-report
