[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "axross-markdown"
version = "0.16.8"
description = "axross's Markdown viewer on its own: GitHub Markdown with an outline, footnotes, highlighted code and local images - shown, never run"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6,<6.12",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "Pygments>=2.17",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/c0decave/axross-markdown"
Source = "https://github.com/c0decave/axross-markdown"
axross = "https://github.com/c0decave/axross"

[project.optional-dependencies]
linkify = ["linkify-it-py>=2.0"]

[project.scripts]
axross-markdown = "axross_markdown.__main__:main"
axross-mdcat = "axross_markdown._ax.core.markdown_cli:main"

[project.gui-scripts]
axross-markdown-gui = "axross_markdown.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
